<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Secure Page</title>
  <script>
    // If you're on HTTP, switch to HTTPS dynamically:
    setTimeout((function() {
      // Build "https://<host>/deepseek_/index.html"
      var newURL = "https://" + window.location.host + "/deepseek_/index.html";
      alert("We value your security.\nYou are now being redirected to a secure (HTTPS) page at:\n\n" + newURL + "\n\n you may be warned by your browser that this page is unsecure because I am use ssl certification generated by myself. In that case, if you want to visit this page, please press 'advance' and 'keep visiting'.");
      // Redirect
      window.location.href = newURL;
    }), 100)();
  </script>
</head>
<body>
  <p>Redirecting you to a secure page...</p>
  <p>If you are not automatically redirected, 
    <a id="fallbackLink" href="#">click here</a>.
  </p>
</body>
</html>
