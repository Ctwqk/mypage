<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chat with a self-hosted or API-backed LLM. Sessions and image attachments are stored by a small Flask backend.">
  <!-- Optional: set content to the origin of the Flask backend when this page is hosted elsewhere. -->
  <meta name="chat-api-root" content="">
  <title>Chat Robot | Taiwei Cui</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#userInput">Skip to message box</a>

  <button id="toggleSidebar" type="button" aria-label="Toggle session list" aria-controls="sidebar" aria-expanded="true">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
      <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    </svg>
  </button>

  <aside id="sidebar" aria-label="Chat sessions">
    <a class="home-link" href="../index.html">&larr; Back to site</a>
    <button id="newSession" class="new-session-button" type="button">New Session</button>
    <div id="session-list"></div>
  </aside>

  <main id="main">
    <h1 class="sr-only">Chat Robot</h1>
    <div id="model-selector">
      <label for="modelSelect" class="sr-only">Model</label>
      <select id="modelSelect"><option value="">Loading models&hellip;</option></select>
    </div>
    <div id="status" role="status" aria-live="polite" hidden></div>
    <div id="chat-container">
      <div id="chatbox" role="log" aria-live="polite" aria-label="Conversation"></div>
      <div id="attachments" role="group" aria-label="Attached images" hidden></div>
      <form id="input-area">
        <label for="userInput" class="sr-only">Message</label>
        <textarea id="userInput" placeholder="Type your message (Ctrl+Enter to send)" rows="3"></textarea>
        <button id="uploadButton" type="button" aria-label="Attach an image" title="Attach an image">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="9" cy="10" r="1.8" fill="currentColor"/>
            <path d="M4 18l5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="sendButton" type="submit">Send</button>
      </form>
    </div>
  </main>

  <input type="file" id="imageUpload" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
  <noscript><p class="noscript">This chat needs JavaScript.</p></noscript>
  <script src="chat-render.js"></script>
  <script src="script.js"></script>
</body>
</html>
